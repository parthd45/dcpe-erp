<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/dcpe-official-logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/dcpe-official-logo.png" />
    <meta name="theme-color" content="#1e1b4b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>DCPE HVPM Amravati — ERP Portal</title>
    <meta name="description" content="Enterprise Resource Planning portal for Degree College of Physical Education, Shree Hanuman Vyayam Prasarak Mandal, Amravati. Access student dashboard, faculty portal, attendance, examination, fees, and more." />
    <meta name="keywords" content="DCPE, HVPM, Amravati, ERP, Student Portal, College Management, MCA, BCA, Physical Education" />
    <meta name="author" content="DCPE HVPM Amravati" />
    <meta property="og:title" content="DCPE HVPM Amravati — ERP Portal" />
    <meta property="og:description" content="Unified digital platform for academics, administration, and student services at DCPE HVPM Amravati." />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('[DCPE ERP PWA] ServiceWorker registered');
            
            // Check for service worker updates immediately
            reg.onupdatefound = () => {
              const installingWorker = reg.installing;
              if (installingWorker) {
                installingWorker.onstatechange = () => {
                  if (installingWorker.state === 'installed') {
                    if (navigator.serviceWorker.controller) {
                      console.log('[DCPE ERP PWA] New update detected, reloading app...');
                      window.location.reload();
                    }
                  }
                };
              }
            };
          }).catch(err => {
            console.error('[DCPE ERP PWA] SW registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
